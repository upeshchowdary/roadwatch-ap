[project]
name = "roadwatch"
version = "0.1.0"
description = "RoadWatch AP — road extraction and new-road change alerting from satellite imagery"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "rasterio>=1.3.10",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "scikit-image>=0.24",
    "networkx>=3.3",
]

[project.optional-dependencies]
serve = ["fastapi>=0.111", "uvicorn>=0.30", "onnxruntime>=1.18"]
kaggle = ["kaggle>=1.6", "huggingface-hub>=0.24"]

[project.scripts]
roadwatch = "roadwatch.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadwatch"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["kaggle/build", "data_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# RUN_CONFIG must stay above imports so kaggle_push.py can inject it
"kaggle/**/train.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test needs internet (skipped in CI)"]
